name: Offline research checks
on:
  push:
  pull_request:
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements/offline.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m weightloss validate
      - run: python -m weightloss build-web
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/frontend/review-assistant.test.js
      - run: python scripts/audit_migration.py
      - run: python scripts/audit_structure.py
      - run: python -m weightloss reproduce-fixture --output-dir .cache/ci-fixture
