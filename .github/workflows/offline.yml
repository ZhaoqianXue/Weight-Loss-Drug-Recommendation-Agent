name: Offline research checks
on:
  push:
  pull_request:
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements/offline.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m weightloss validate
      - run: python -m weightloss build-web
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web lint
      - run: pnpm --dir apps/web build
      - run: python -m weightloss reproduce-fixture --output-dir .cache/ci-fixture
