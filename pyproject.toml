[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "weightloss-research"
version = "0.1.0"
description = "Reproducible research workflows for patient medication reviews"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
collection = ["requests==2.32.3", "lxml==5.4.0"]
web = ["Flask==3.1.1"]
extraction = ["langchain-openai==0.3.18", "pydantic==2.11.5", "pandas==2.2.3", "numpy==1.26.4", "tqdm==4.67.1"]
standardization = ["openai==1.82.0", "sentence-transformers==2.6.1", "transformers==4.51.3", "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'", "torch==2.7.0; sys_platform != 'darwin' or platform_machine != 'x86_64'", "pandas==2.2.3", "numpy==1.26.4", "tqdm==4.67.1"]
retrieval = ["weightloss-research[extraction,standardization]", "langchain==0.3.25", "langchain-community==0.3.24", "faiss-cpu==1.11.0", "neo4j==5.28.1"]
embeddings = ["weightloss-research[standardization]", "pdfplumber==0.11.6", "camelot-py==1.0.0", "chardet==5.2.0"]
dev = ["weightloss-research[collection,web]", "build==1.2.2.post1"]

[project.scripts]
weightloss = "weightloss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
